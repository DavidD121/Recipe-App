services:
  db:
    image: postgres:18-alpine
    container_name: recipe-app-db
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Scripts here run ONLY when pgdata is empty. See README.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
